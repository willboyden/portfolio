# Production nginx for the portfolio static site.
#
# Design goals: immutable caching for hashed assets, correct SPA fallback for
# deep links (every route also exists as a real prerendered HTML file),
# security headers, compression, and no server fingerprint leakage.
#
# Static output layout (from `npm run build`):
#   /index.html  /about/index.html  /projects/<slug>/index.html ...
#   /posts/<slug>/index.html  /assets/<name>-<hash>.js|css
#   /rss.xml  /sitemap.xml  /robots.txt  /site.webmanifest  /favicon.svg

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirect to HTTPS in production. Terminate TLS with your cert provider:
    #   return 301 https://$host$request_uri;
    # (kept disabled so the container boots with no certificates mounted)

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # ---- compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/html
        text/css
        text/plain
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Pre-compressed siblings produced by the build (gzip -9k) beat runtime gzip:
    # `nginx` serves them directly with the right Content-Encoding header.
    gzip_static on;

    # ---- security headers (added once, inherited) --------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Static site with no inline third-party code: keep the rope tight.
    # `unsafe-inline` is required for the CSP hash-free prerender approach we
    # avoid — all styles are emotion-injected at runtime, so styles are allowed
    # self+unsafe-inline ONLY (emotion injects <style> tags), scripts are locked.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ---- immutable hashed build assets --------------------------------------
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Fonts (if served outside /assets) get the same treatment.
    location ~* \.(woff2|woff)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Images: long cache, but revalidatable (they are not content-hashed).
    location ~* \.(png|jpe?g|gif|webp|avif|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        access_log off;
        try_files $uri =404;
    }

    # Feeds & discovery documents must never go stale.
    location ~* /(rss\.xml|feed\.xml|atom\.xml|sitemap\.xml|robots\.txt|site\.webmanifest)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }

    # Admin-ish paths that should not exist: fail closed, quietly.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ---- pages: real prerendered files first, then SPA fallback ------------
    # /projects/foo -> /projects/foo/index.html (prerendered, real URL for SEO)
    # unknown /client-only paths -> /index.html, router takes over.
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    # Prerendered 404 page (served with a real 404 status).
    error_page 404 /404/index.html;
    location = /404/index.html {
        internal;
        add_header Cache-Control "no-store";
    }
}
