# Security headers — included at server level AND in EVERY location that sets
# its own add_header. nginx only inherits parent add_header directives when a
# location declares NONE of its own, so a location that adds just Cache-Control
# would otherwise serve responses with no CSP/XFO/nosniff at all (R1-C #1).
# Keep this file's header set mirrored by scripts/serve-dist.mjs — e2e spec
# 06-security asserts the CSP string, and a config-lint test diffs this file
# against every add_header-bearing location in deploy/nginx.conf.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Static site with no inline third-party code: keep the rope tight.
# `unsafe-inline` on styles is required because emotion injects <style>
# tags at runtime and the prerender emits one inline. Scripts stay locked
# to 'self' — the theme-init snippet ships as /theme-init.js, not inline.
# No data: images ship anywhere in the pipeline (the markdown engine rejects
# data URIs) — R1-C #8 tightened img-src to 'self'. object-src 'none' is
# explicit rather than default-inherited.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
