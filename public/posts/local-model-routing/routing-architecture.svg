<text x="312" y="316" font-size="12" fill="#455a64">affinity: first-user-message hash</text>
<line x1="380" y1="190" x2="380" y2="238" stroke="#212121" stroke-width="2" marker-end="url(#arr)"/><text x="370" y="208" font-size="11" fill="#455a64">judge (1x/conv)</text>
<line x1="430" y1="275" x2="700" y2="200" stroke="#212121" stroke-width="2" marker-end="url(#arr)"/><text x="555" y="231" font-size="11" fill="#455a64">score &lt; threshold -&gt; strong</text>
<rect x="10" y="240" width="240" height="70" rx="8" fill="#eceff1" stroke="#212121"/>
<text x="22" y="262" font-weight="bold" fill="#212121">LiteLLM router :4000</text>
<text x="22" y="282" font-size="12" fill="#455a64">auth, spend, Presidio PII guard</text>
<text x="22" y="299" font-size="12" fill="#455a64">spend + api_key_alias telemetry</text>
<line x1="560" y1="200" x2="252" y2="262" stroke="#212121" stroke-width="2" marker-end="url(#arr)"/><text x="396" y="225" font-size="11" fill="#455a64">tier calls</text>
<line x1="120" y1="240" x2="120" y2="128" stroke="#212121" stroke-width="2" marker-end="url(#arr)"/><text x="110" y="178" font-size="11" fill="#455a64">upstream</text>
<text x="12" y="345" font-size="12" fill="#78909c">Dashed = judge path. Fail-closed: an invalid judge verdict routes to the STRONG tier. Passthrough route ids bypass the judge entirely.</text></svg>
