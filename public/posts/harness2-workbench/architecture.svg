<svg xmlns="http://www.w3.org/2000/svg" width="640" height="590" viewBox="0 0 640 590" font-family="Helvetica,Arial,sans-serif" font-size="14" role="img" aria-labelledby="t d"><title id="t">Harness² Workbench architecture</title><desc id="d">Browsers and MCP agents reach one Rust server; the MCP server is a thin client that forwards the caller's token. The server owns authentication, roles, the audit log and SQLite, reads plain harness2 experiment directories, and starts harness2 as jobs, either on the host as an accepted risk or in a hardened container whose only way out is an allowlisting egress proxy.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#212121"/></marker></defs>
<rect x="10" y="10" width="300" height="74" rx="8" fill="#e3f2fd" stroke="#212121"/>
<text x="24" y="34" font-size="15" font-weight="bold" fill="#212121">Browser</text>
<text x="24" y="56" font-size="13" fill="#455a64">Leptos UI compiled to WebAssembly</text>
<text x="24" y="74" font-size="13" fill="#455a64">strict CSP, same origin only</text>
<rect x="330" y="10" width="300" height="74" rx="8" fill="#e3f2fd" stroke="#212121"/>
<text x="344" y="34" font-size="15" font-weight="bold" fill="#212121">AI agents</text>
<text x="344" y="56" font-size="13" fill="#455a64">Claude Code, opencode, Codex, …</text>
<text x="344" y="74" font-size="13" fill="#455a64">one token each, viewer recommended</text>
<line x1="480" y1="84" x2="480" y2="106" stroke="#212121" marker-end="url(#arr)"/>
<rect x="330" y="110" width="300" height="60" rx="8" fill="#e3f2fd" stroke="#212121"/>
<text x="344" y="134" font-size="15" font-weight="bold" fill="#212121">h2workbench-mcp</text>
<text x="344" y="156" font-size="13" fill="#455a64">42 tools; forwards the caller's token</text>
<line x1="160" y1="84" x2="160" y2="196" stroke="#212121" marker-end="url(#arr)"/>
<text x="168" y="130" font-size="12" fill="#455a64">HTTPS via a proxy,</text>
<text x="168" y="146" font-size="12" fill="#455a64">or loopback</text>
<line x1="480" y1="170" x2="480" y2="196" stroke="#212121" marker-end="url(#arr)"/>
<rect x="10" y="200" width="620" height="152" rx="8" fill="#fff8e1" stroke="#212121"/>
<text x="24" y="226" font-size="15" font-weight="bold" fill="#212121">h2workbench: one server for roles, limits and audit</text>
<text x="24" y="252" font-size="13" fill="#455a64">REST /api/v1, 49 operations</text>
<text x="24" y="274" font-size="13" fill="#455a64">live logs over SSE, embedded UI</text>
<text x="24" y="296" font-size="13" fill="#455a64">tokens, sessions, proxy sign-on</text>
<text x="24" y="318" font-size="13" fill="#455a64">roles: viewer &lt; operator &lt; admin</text>
<text x="330" y="252" font-size="13" fill="#455a64">hash-chained audit log</text>
<text x="330" y="274" font-size="13" fill="#455a64">SQLite (WAL), write-only secrets</text>
<text x="330" y="296" font-size="13" fill="#455a64">Prometheus metrics, OTLP traces</text>
<text x="330" y="318" font-size="13" fill="#455a64">bounded reads of job output</text>
<line x1="160" y1="352" x2="160" y2="376" stroke="#212121" marker-end="url(#arr)"/>
<line x1="480" y1="352" x2="480" y2="376" stroke="#212121" marker-end="url(#arr)"/>
<rect x="10" y="380" width="300" height="80" rx="8" fill="#fff8e1" stroke="#212121"/>
<text x="24" y="404" font-size="15" font-weight="bold" fill="#212121">Job engine</text>
<text x="24" y="426" font-size="13" fill="#455a64">argv only; a process group per step</text>
<text x="24" y="446" font-size="13" fill="#455a64">cancel, timeout, budget, recovery</text>
<rect x="330" y="380" width="300" height="80" rx="8" fill="#f3e5f5" stroke="#212121"/>
<text x="344" y="404" font-size="15" font-weight="bold" fill="#212121">Experiments and harness2</text>
<text x="344" y="426" font-size="13" fill="#455a64">plain harness2 run directories</text>
<text x="344" y="446" font-size="13" fill="#455a64">harness2 at a pinned commit, unmodified</text>
<line x1="100" y1="460" x2="100" y2="496" stroke="#212121" marker-end="url(#arr)"/>
<line x1="250" y1="460" x2="300" y2="496" stroke="#212121" marker-end="url(#arr)"/>
<rect x="10" y="500" width="190" height="80" rx="8" fill="#fff3e0" stroke="#212121"/>
<text x="22" y="524" font-size="15" font-weight="bold" fill="#212121">host isolation</text>
<text x="22" y="546" font-size="13" fill="#455a64">runs as the server user:</text>
<text x="22" y="566" font-size="13" fill="#455a64">an accepted risk</text>
<rect x="220" y="500" width="200" height="80" rx="8" fill="#e8f5e9" stroke="#212121"/>
<text x="232" y="524" font-size="15" font-weight="bold" fill="#212121">container isolation</text>
<text x="232" y="546" font-size="13" fill="#455a64">all capabilities dropped,</text>
<text x="232" y="566" font-size="13" fill="#455a64">internal network only</text>
<line x1="420" y1="540" x2="436" y2="540" stroke="#212121" marker-end="url(#arr)"/>
<rect x="440" y="500" width="190" height="80" rx="8" fill="#e8f5e9" stroke="#212121"/>
<text x="452" y="524" font-size="15" font-weight="bold" fill="#212121">egress proxy</text>
<text x="452" y="546" font-size="13" fill="#455a64">host and port allowlist,</text>
<text x="452" y="566" font-size="13" fill="#455a64">the only way out</text>
</svg>
