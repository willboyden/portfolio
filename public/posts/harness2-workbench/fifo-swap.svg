<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="Helvetica,Arial,sans-serif" font-size="14" role="img" aria-labelledby="t d"><title id="t">The FIFO swap, before and after the fix</title><desc id="d">Before: the reader checks summary.json with lstat, the job swaps a FIFO into its place, and a plain open blocks forever while holding one of four read permits. After: the reader opens without blocking and without following links, then checks with fstat that the handle is a regular file with the inode it checked; a swapped-in FIFO is refused at once.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#212121"/></marker></defs>
<text x="10" y="24" font-size="15" font-weight="bold" fill="#b71c1c">Before: check, then open</text>
<rect x="10" y="38" width="180" height="80" rx="8" fill="#e3f2fd" stroke="#212121"/>
<text x="22" y="62" font-weight="bold" fill="#212121">1. lstat()</text>
<text x="22" y="84" font-size="13" fill="#455a64">summary.json is a</text>
<text x="22" y="102" font-size="13" fill="#455a64">regular file</text>
<rect x="225" y="38" width="180" height="80" rx="8" fill="#fff3e0" stroke="#212121"/>
<text x="237" y="62" font-weight="bold" fill="#212121">2. the job swaps it</text>
<text x="237" y="84" font-size="13" fill="#455a64">renameat2 exchanges</text>
<text x="237" y="102" font-size="13" fill="#455a64">it with a FIFO</text>
<rect x="440" y="38" width="190" height="80" rx="8" fill="#ffebee" stroke="#b71c1c"/>
<text x="452" y="62" font-weight="bold" fill="#b71c1c">3. open() blocks</text>
<text x="452" y="84" font-size="13" fill="#455a64">forever, holding one</text>
<text x="452" y="102" font-size="13" fill="#455a64">of four read permits</text>
<line x1="190" y1="78" x2="222" y2="78" stroke="#212121" marker-end="url(#arr)"/>
<line x1="405" y1="78" x2="437" y2="78" stroke="#212121" marker-end="url(#arr)"/>
<text x="10" y="142" font-size="13" fill="#455a64">Reproduced: the first hang after about 6 s; by about 35 s every results call failed.</text>
<text x="10" y="184" font-size="15" font-weight="bold" fill="#2e7d32">After: open without blocking, then check what was opened</text>
<rect x="10" y="198" width="180" height="80" rx="8" fill="#e3f2fd" stroke="#212121"/>
<text x="22" y="222" font-weight="bold" fill="#212121">1. lstat()</text>
<text x="22" y="244" font-size="13" fill="#455a64">note the file type,</text>
<text x="22" y="262" font-size="13" fill="#455a64">device and inode</text>
<rect x="225" y="198" width="180" height="80" rx="8" fill="#e8f5e9" stroke="#212121"/>
<text x="237" y="222" font-weight="bold" fill="#212121">2. open()</text>
<text x="237" y="244" font-size="12" font-family="Menlo,Consolas,monospace" fill="#455a64">O_NONBLOCK|O_NOFOLLOW</text>
<text x="237" y="262" font-size="13" fill="#455a64">returns at once</text>
<rect x="440" y="198" width="190" height="80" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
<text x="452" y="222" font-weight="bold" fill="#2e7d32">3. fstat() the handle</text>
<text x="452" y="244" font-size="13" fill="#455a64">not a regular file, or</text>
<text x="452" y="262" font-size="13" fill="#455a64">another inode: refuse</text>
<line x1="190" y1="238" x2="222" y2="238" stroke="#212121" marker-end="url(#arr)"/>
<line x1="405" y1="238" x2="437" y2="238" stroke="#212121" marker-end="url(#arr)"/>
<text x="10" y="302" font-size="13" fill="#455a64">Checked live: a FIFO swapped over summary.json nine million times while</text>
<text x="10" y="320" font-size="13" fill="#455a64">tasks were listed; no read hung.</text>
</svg>
