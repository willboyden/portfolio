<svg xmlns="http://www.w3.org/2000/svg" width="620" height="400" viewBox="0 0 620 400" font-family="Helvetica,Arial,sans-serif" font-size="13" role="img" aria-labelledby="t d"><title id="t">Layout of the DeepSeek-V4.1 engine across five machines</title><desc id="d">Diagram. Stage 0 is four GB10 boxes at tensor parallel 4 holding layers 0 to 19, including both Engram layers; each box caches its 47 GiB slice of the Engram tables; its all-reduce runs over NCCL on 200 Gb/s RoCE. Stage 1 is one x86 workstation with two RTX PRO 6000 cards at tensor parallel 2 holding layers 20 to 39, the draft head and the output head; its all-reduce uses PCIe peer-to-peer. Each step, hidden states flow forward and every receiver takes the full tensor from one sender; sampled and draft tokens come back to every rank as one broadcast.</desc><rect width="100%" height="100%" fill="white"/>
<text x="16.0" y="28.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="bold">One engine, two pipeline stages</text>
<text x="16.0" y="49.0" font-size="14" fill="#52514e" text-anchor="start">DeepSeek-V4.1-Flash-1017 in vLLM; each stage has its own tensor-parallel size</text>
<rect x="16" y="66" width="318" height="250" rx="10" fill="#eef4fc" stroke="#9fbfe6"/>
<text x="30.0" y="92.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="bold">Stage 0 · tensor parallel 4</text>
<text x="30.0" y="113.0" font-size="14" fill="#52514e" text-anchor="start">four GB10 boxes (Arm, 273 GB/s each)</text>
<rect x="30" y="126" width="137" height="42" rx="6" fill="white" stroke="#9fbfe6"/>
<text x="98.5" y="152.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">GB10 #1</text>
<rect x="177" y="126" width="137" height="42" rx="6" fill="white" stroke="#9fbfe6"/>
<text x="245.5" y="152.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">GB10 #2</text>
<rect x="30" y="176" width="137" height="42" rx="6" fill="white" stroke="#9fbfe6"/>
<text x="98.5" y="202.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">GB10 #3</text>
<rect x="177" y="176" width="137" height="42" rx="6" fill="white" stroke="#9fbfe6"/>
<text x="245.5" y="202.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">GB10 #4</text>
<text x="30.0" y="250.0" font-size="15" fill="#0b0b0b" text-anchor="start">layers 0–19, both Engram layers</text>
<text x="30.0" y="272.0" font-size="14" fill="#52514e" text-anchor="start">each box caches its 47 GiB table slice</text>
<text x="30.0" y="294.0" font-size="14" fill="#52514e" text-anchor="start">all-reduce: NCCL over 200 Gb/s RoCE</text>
<rect x="390" y="66" width="214" height="250" rx="10" fill="#fdf0ea" stroke="#efb79e"/>
<text x="404.0" y="92.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="bold">Stage 1 · TP 2</text>
<text x="404.0" y="113.0" font-size="14" fill="#52514e" text-anchor="start">one x86 workstation</text>
<rect x="404" y="126" width="186" height="42" rx="6" fill="white" stroke="#efb79e"/>
<text x="497.0" y="152.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">RTX PRO 6000 (96 GB)</text>
<rect x="404" y="176" width="186" height="42" rx="6" fill="white" stroke="#efb79e"/>
<text x="497.0" y="202.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">RTX PRO 6000 (96 GB)</text>
<text x="404.0" y="250.0" font-size="15" fill="#0b0b0b" text-anchor="start">layers 20–39</text>
<text x="404.0" y="272.0" font-size="14" fill="#52514e" text-anchor="start">+ draft head, output head</text>
<text x="404.0" y="294.0" font-size="14" fill="#52514e" text-anchor="start">all-reduce: PCIe P2P</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker></defs>
<line x1="337" y1="150" x2="386" y2="150" stroke="#0b0b0b" stroke-width="2" marker-end="url(#a)"/>
<line x1="387" y1="200" x2="338" y2="200" stroke="#0b0b0b" stroke-width="2" marker-end="url(#a)"/>
<text x="16.0" y="344.0" font-size="14" fill="#0b0b0b" text-anchor="start">→ each step, hidden states go forward: every receiver takes the full tensor</text>
<text x="16.0" y="364.0" font-size="14" fill="#0b0b0b" text-anchor="start">    from one sender (a stage's ranks hold the same values after its all-reduce)</text>
<text x="16.0" y="388.0" font-size="14" fill="#0b0b0b" text-anchor="start">← sampled and draft tokens come back to every rank as one broadcast</text>
</svg>
