# Security audit for PRs to willboyden/portfolio (R10).
# Runs alongside the CI gates; every check surfaces ::error:: annotations.
# A PR cannot merge while any of these fail.
name: Security audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (changed files vs base)
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(md|mdx|ts|tsx|mjs|js|json|ya?ml)$' || true)
          FAIL=0
          for f in $CHANGED; do
            [ -f "$f" ] || continue
            # R9C-7: quote the path — unquoted loop vars break on spaces.
            if grep -nE 'github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z]+ PRIVATE KEY-----' "$f"; then
              echo "::error::secret pattern found in $f"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: XSS check (dangerouslySetInnerHTML allowlist)
        run: |
          FAIL=0
          for f in $(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.tsx?$' || true); do
            [ -f "$f" ] || continue
            if grep -n 'dangerouslySetInnerHTML' "$f"; then
              echo "::error::dangerouslySetInnerHTML introduced in $f — content must flow through the sanitize pipeline"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Base-path regression check
        run: |
          # Root-absolute asset hrefs in emitted HTML would 404 on Pages.
          # Only meaningful if the diff touched build inputs; run the check
          # on the checked-in generated content as a smoke signal.
          FAIL=0
          for f in $(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E 'content/|vite\.config|prerender' || true); do
            echo "::notice::build-input changed: $f — verify emitted hrefs are /portfolio/-prefixed after CI build"
          done
          if [ -f dist/index.html ]; then
            if grep -qE 'src="/assets/' dist/index.html; then
              echo "::error::root-absolute asset hrefs found in dist/index.html"
              FAIL=1
            fi
          fi
          exit $FAIL

      - name: Truthfulness check (fast)
        run: |
          pip install --quiet jsonschema 2>/dev/null || true
          python3 scripts/truthfulness_check.py --fast

      - name: Frontmatter parse check
        run: |
          node scripts/build-content.mjs
