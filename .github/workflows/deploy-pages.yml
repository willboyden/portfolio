name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22. The npm cache is enabled ONLY when a lockfile exists —
      # setup-node hard-fails on cache:npm without one, and the lockfile is
      # generated host-side (the sandbox cannot reach the npm registry).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install (lockfile-pinned when present)
        run: |
          if [ -f package-lock.json ]; then
            npm ci || { echo "::error::npm ci failed"; exit 1; }
          else
            npm install --no-audit --no-fund || { echo "::error::npm install failed"; exit 1; }
          fi

      # The e2e harness drives chrome-headless-shell over raw CDP (zero-dep).
      # Install the same binary the sandbox uses, then point CHROME_BIN at it.
      - name: Commit npm debug log to ci-debug branch (on failure)
        if: failure()
        run: |
          # The artifact API is unreadable with the current token; commit the
          # log to a branch so the orchestrator can read it via contents:read.
          pip install --quiet requests 2>/dev/null || true
          LOGFILE=$(ls -t /home/runner/.npm/_logs/*.log 2>/dev/null | head -1)
          if [ -n "$LOGFILE" ]; then
            python3 - "$LOGFILE" <<'PYEOF'
import base64, json, os, sys
from urllib.request import Request, urlopen
token = os.environ["GITHUB_TOKEN"]
repo = os.environ["GITHUB_REPOSITORY"]
data = open(sys.argv[1], "rb").read()
body = {"message": "npm debug log from failed run", "content": base64.b64encode(data).decode(), "branch": "ci-debug"}
try:
    r = urlopen(Request(f"https://api.github.com/repos/{repo}/contents/ci-debug/npm-log.txt?ref=ci-debug", headers={"Authorization": f"Bearer {token}", "User-Agent": "ci"}), timeout=30)
    body["sha"] = json.loads(r.read())["sha"]
except Exception:
    pass
req = Request(f"https://api.github.com/repos/{repo}/contents/ci-debug/npm-log.txt", method="PUT",
              headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "Content-Type": "application/json"},
              data=json.dumps(body).encode())
print("committed:", urlopen(req, timeout=30).status)
PYEOF
          fi

      - name: Install chrome-headless-shell for e2e
        run: |
          npx --yes @puppeteer/browsers install chrome-headless-shell@stable --path "$HOME/.cache/chrome"
          CHROME_PATH=$(find "$HOME/.cache/chrome" -name "chrome-headless-shell" -type f | head -1)
          echo "CHROME_BIN=$CHROME_PATH" >> "$GITHUB_ENV"

      # Full gate chain BEFORE any deploy: a red build never ships.
      # The e2e suite runs against the served dist with headless Chromium
      # (the repo's zero-dep CDP harness) — no Playwright download needed.
      - name: Typecheck
        run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.json
      - name: Lint
        run: node node_modules/eslint/bin/eslint.js . --max-warnings 0
      - name: Unit tests
        run: node node_modules/vitest/vitest.mjs run
      - name: Build + audit
        run: node scripts/build.mjs
      - name: E2E (CDP harness, headless Chromium)
        run: node e2e/run.mjs

      # Vite base path: GitHub Pages serves project sites under /<repo>/.
      # SITE.url + vite base are derived from the repo name here so the same
      # source deploys to both nginx (root) and Pages (subpath).
      - name: Compute Pages base path
        id: base
        run: echo "path=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Rebuild with Pages base path
        run: |
          npx vite build --base="${{ steps.base.outputs.path }}/"
          # SITE_URL override: canonical/sitemap/RSS/OG must carry the FINAL
          # Pages URL (https://<user>.github.io/<repo>), not the placeholder
          # domain, or search engines index the wrong origin.
          SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}" \
            node scripts/prerender.mjs
          node scripts/audit-dist.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
