name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # R8: BOTH bundles (client via vite.config.ts base, prerender via
      # vite.config.prerender.ts define) inline this at BUILD time. It must
      # be set before ANY build step — job-level env guarantees that.
      VITE_BASE: /portfolio/
      SITE_URL: https://willboyden.github.io/portfolio/
    steps:
      - uses: actions/checkout@v4

      # Node 22. The npm cache is enabled ONLY when a lockfile exists —
      # setup-node hard-fails on cache:npm without one, and the lockfile is
      # generated host-side (the sandbox cannot reach the npm registry).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install (resolve once, then ci from the resolved lockfile)
        run: |
          if [ ! -f package-lock.json ]; then
            # Resolve ONCE with the wide net (legacy-peer-deps tolerates the
            # peer ranges in this graph), producing a complete lockfile.
            npm install --package-lock-only --no-audit --no-fund --legacy-peer-deps
          fi
          # ci installs from the lockfile WITHOUT re-resolving (arborist
          # skip) — deterministic regardless of the file: graph.
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund --legacy-peer-deps

      # The e2e harness drives chrome-headless-shell over raw CDP (zero-dep).
      # Install the same binary the sandbox uses, then point CHROME_BIN at it.
      - name: Commit npm debug log to ci-debug branch (on failure)
        if: failure()
        run: |
          # Simple, heredoc-free: base64 the log, PUT via node's fetch.
          LOGFILE=$(ls -t /home/runner/.npm/_logs/*.log 2>/dev/null | head -1)
          if [ -n "$LOGFILE" ]; then
            B64=$(base64 -w0 "$LOGFILE")
            node -e "
              const b64 = process.env.NPM_LOG_B64;
              const body = {message: 'npm debug log from failed run', content: b64, branch: 'ci-debug'};
              fetch('https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + '/contents/ci-debug/npm-log.txt', {
                method: 'PUT',
                headers: {Authorization: 'Bearer ' + process.env.GITHUB_TOKEN, 'Content-Type': 'application/json', Accept: 'application/vnd.github+json'},
                body: JSON.stringify(body)
              }).then(async r => console.log('log commit:', r.status)).catch(e => console.log('log commit failed:', e.message));
            " || true
          fi

      - name: Install chrome-headless-shell for e2e
        run: |
          npx --yes @puppeteer/browsers install chrome-headless-shell@stable --path "$HOME/.cache/chrome"
          CHROME_PATH=$(find "$HOME/.cache/chrome" -name "chrome-headless-shell" -type f | head -1)
          echo "CHROME_BIN=$CHROME_PATH" >> "$GITHUB_ENV"

      # Full gate chain BEFORE any deploy: a red build never ships.
      # The e2e suite runs against the served dist with headless Chromium
      # (the repo's zero-dep CDP harness) — no Playwright download needed.
      - name: Typecheck
        run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.json
      - name: Lint
        run: node node_modules/eslint/bin/eslint.js . --max-warnings 0
      - name: Unit tests
        run: node node_modules/vitest/vitest.mjs run
      - name: Build + audit
        run: node scripts/build.mjs
      - name: DEBUG baked base in client bundle
        run: |
          JSFILE=$(ls dist/assets/vendor-*.js | head -1)
          BAKED=$(grep -oP 'let n=\`[^\`]*\`' "$JSFILE" | head -1)
          echo "::error::BAKED BASE = $BAKED (expected /portfolio/)"
          grep -o 'let n=`[^`]*`' "$JSFILE" | head -1

      - name: DEBUG emitted page hrefs
        run: |
          echo '::error::HOME hrefs:'
          grep -o 'href="[^"]*"' dist/index.html | head -8 | while read -r l; do echo "::error::$l"; done
          echo '::error::PROJECTS hrefs:'
          grep -o 'href="[^"]*"' dist/projects/index.html | head -8 | while read -r l; do echo "::error::$l"; done

      - name: E2E (CDP harness, headless Chromium)
        run: node e2e/run.mjs

      # R8: VITE_BASE/SITE_URL are job-level env (set above); this rebuild
      # re-runs the FULL pipeline so BOTH bundles + prerendered pages carry
      # the base-prefixed paths. (The earlier Build+audit step ran the same
      # pipeline with the same env, so dist is already correct — this pass
      # is a belt-and-braces rebuild + final audit.)
      - name: Rebuild + final audit (Pages base)
        run: |
          node scripts/build.mjs
          node scripts/audit-dist.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
