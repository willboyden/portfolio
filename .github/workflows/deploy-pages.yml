name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # R8: BOTH bundles (client via vite.config.ts base, prerender via
      # vite.config.prerender.ts define) inline this at BUILD time. It must
      # be set before ANY build step — job-level env guarantees that.
      VITE_BASE: /portfolio/
      SITE_URL: https://willboyden.github.io/portfolio/
    steps:
      - uses: actions/checkout@v4

      # Node 22. The npm cache is enabled ONLY when a lockfile exists —
      # setup-node hard-fails on cache:npm without one, and the lockfile is
      # generated host-side (the sandbox cannot reach the npm registry).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install (resolve once, then ci from the resolved lockfile)
        run: |
          if [ ! -f package-lock.json ]; then
            # Resolve ONCE with the wide net (legacy-peer-deps tolerates the
            # peer ranges in this graph), producing a complete lockfile.
            npm install --package-lock-only --no-audit --no-fund --legacy-peer-deps
          fi
          # ci installs from the lockfile WITHOUT re-resolving (arborist skip).
          # R9C-3: npm ci is the primary path now that the lockfile is
          # committed and proven — a lockfile/application mismatch must FAIL
          # LOUDLY (annotation + exit 1), not silently reinstall fresh
          # resolution (that was the drift-swallowing `|| npm install`).
          npm ci --no-audit --no-fund || {
            echo "::error::npm ci failed — package-lock.json is out of sync with package.json. Run 'npm install --legacy-peer-deps' locally and commit the updated lockfile; do NOT paper over it with a fresh install."
            exit 1
          }

      # The e2e harness drives chrome-headless-shell over raw CDP (zero-dep).
      # Install the same binary the sandbox uses, then point CHROME_BIN at it.
      # R9C-5: the R12 debug aid (auto-commit npm logs to a public branch on
      # failure) was REMOVED — npm debug logs can carry env/URL fragments and
      # the install is now deterministic (pinned chrome, npm ci). If installs
      # fail again, re-add temporarily with redaction, don't leave it armed.
      # R7B-03: pinned exact version — @stable is a floating supply-chain tag
      # (a bad "stable" release would break every future deploy). Bump this
      # deliberately, with the e2e suite as the regression gate.
      - name: Install chrome-headless-shell for e2e
        run: |
          npx --yes @puppeteer/browsers install chrome-headless-shell@151.0.7922.34 --path "$HOME/.cache/chrome"
          CHROME_PATH=$(find "$HOME/.cache/chrome" -name "chrome-headless-shell" -type f | head -1)
          echo "CHROME_BIN=$CHROME_PATH" >> "$GITHUB_ENV"

      # Full gate chain BEFORE any deploy: a red build never ships.
      # The e2e suite runs against the served dist with headless Chromium
      # (the repo's zero-dep CDP harness) — no Playwright download needed.
      - name: Typecheck
        run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.json
      - name: Lint
        run: node node_modules/eslint/bin/eslint.js . --max-warnings 0
      - name: Unit tests
        run: node node_modules/vitest/vitest.mjs run
      - name: Build + audit
        run: node scripts/build.mjs

      # R8: VITE_BASE/SITE_URL are job-level env (set above); this rebuild
      # re-runs the FULL pipeline so BOTH bundles + prerendered pages carry
      # the base-prefixed paths. (The earlier Build+audit step ran the same
      # pipeline with the same env, so dist is already correct — this pass
      # is a belt-and-braces rebuild + final audit.)
      - name: Rebuild + final audit (Pages base)
        run: |
          node scripts/build.mjs
          node scripts/audit-dist.mjs

      # R7B-02: e2e runs HERE — against the subpath-base artifact that actually
      # ships to Pages, not only the root-base intermediate (they are not the
      # same HTML: asset hrefs, canonical/OG and the 404 root copy differ).
      # e2e/run.mjs serves the existing dist/ as-is.
      - name: E2E (CDP harness, headless Chromium, Pages-base artifact)
        run: node e2e/run.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
