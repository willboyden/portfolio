name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22. The npm cache is enabled ONLY when a lockfile exists —
      # setup-node hard-fails on cache:npm without one, and the lockfile is
      # generated host-side (the sandbox cannot reach the npm registry).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install (lockfile-pinned when present)
        run: |
          if [ -f package-lock.json ]; then
            npm ci || { echo "::error::npm ci failed"; grep -h "npm error" ~/.npm/_logs/*.log | head -20 | while read -r l; do echo "::error::$l"; done; exit 1; }
          else
            npm install --no-audit --no-fund --legacy-peer-deps \
              || npm install --no-audit --no-fund --legacy-peer-deps --install-strategy=shallow \
              || { echo "::error::all install strategies failed"; tail -60 ~/.npm/_logs/*.log | while read -r l; do echo "::error::$l"; done; exit 1; }
          fi

      # The e2e harness drives chrome-headless-shell over raw CDP (zero-dep).
      # Install the same binary the sandbox uses, then point CHROME_BIN at it.
      - name: Install chrome-headless-shell for e2e
        run: |
          npx --yes @puppeteer/browsers install chrome-headless-shell@stable --path "$HOME/.cache/chrome"
          CHROME_PATH=$(find "$HOME/.cache/chrome" -name "chrome-headless-shell" -type f | head -1)
          echo "CHROME_BIN=$CHROME_PATH" >> "$GITHUB_ENV"

      # Full gate chain BEFORE any deploy: a red build never ships.
      # The e2e suite runs against the served dist with headless Chromium
      # (the repo's zero-dep CDP harness) — no Playwright download needed.
      - name: Typecheck
        run: |
          node node_modules/typescript/bin/tsc --noEmit -p tsconfig.json             || { echo "::error::tsc failed - errors below";                  node node_modules/typescript/bin/tsc --noEmit -p tsconfig.json 2>&1 | head -30 | while read -r l; do echo "::error::$l"; done;                  exit 1; }
      - name: Lint
        run: |
          node node_modules/eslint/bin/eslint.js . --max-warnings 0             || { echo "::error::eslint failed - errors below";                  node node_modules/eslint/bin/eslint.js . --max-warnings 0 2>&1 | tail -40 | while read -r l; do echo "::error::$l"; done;                  exit 1; }
      - name: Unit tests
        run: node node_modules/vitest/vitest.mjs run
      - name: Build + audit
        run: node scripts/build.mjs
      - name: E2E (CDP harness, headless Chromium)
        run: node e2e/run.mjs

      # Vite base path: GitHub Pages serves project sites under /<repo>/.
      # SITE.url + vite base are derived from the repo name here so the same
      # source deploys to both nginx (root) and Pages (subpath).
      - name: Compute Pages base path
        id: base
        run: |
          echo "path=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
          # Job-level: the prerender BUNDLE is built inside scripts/build.mjs
          # (vite.config.prerender.ts inlines import.meta.env.BASE_URL from
          # VITE_BASE at bundle time), so it must be set BEFORE the rebuild.
          echo "VITE_BASE=${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"

      - name: Rebuild with Pages base path
        run: |
          npx vite build --base="${{ steps.base.outputs.path }}/"
          # VITE_BASE: the prerender bundle's import.meta.env.BASE_URL (injected
          # via vite define) - the SSR pass emits base-prefixed hrefs too.
          # SITE_URL override: canonical/sitemap/RSS/OG must carry the FINAL
          # Pages URL (https://<user>.github.io/<repo>), not the placeholder
          # domain, or search engines index the wrong origin.
          VITE_BASE="${{ steps.base.outputs.path }}/" \
            SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}" \
            node scripts/prerender.mjs
          node scripts/audit-dist.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
